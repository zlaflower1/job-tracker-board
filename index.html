<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 현황 보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>지원 현황 보드</h1>
    <p class="lead">지원한 회사와 진행 상황을 한곳에서 관리해요. 입력한 내용은 이 브라우저 안에만 저장돼요.</p>

    <p id="storageWarning" class="warning" hidden>이 브라우저에서는 저장이 막혀 있어요. 페이지를 닫으면 내용이 사라질 수 있어요.</p>

    <!-- 1단계: 회사 추가 -->
    <section class="card">
      <h2>회사 추가</h2>

      <label for="companyInput">회사명 (필수)</label>
      <input id="companyInput" type="text" placeholder="예: 가나다전자">

      <label for="jobInput">지원 직무</label>
      <input id="jobInput" type="text" placeholder="예: 재무회계">

      <label for="deadlineInput">지원 마감일</label>
      <input id="deadlineInput" type="date">

      <label for="statusSelect">진행 상태</label>
      <select id="statusSelect"></select>

      <label for="memoInput">메모</label>
      <input id="memoInput" type="text" placeholder="예: 1차 면접 준비물 확인">

      <p id="formMessage" class="warning" hidden></p>

      <div class="button-row">
        <button id="exampleBtn" class="btn btn-big" type="button">예시 채우기</button>
        <button id="addBtn" class="btn btn-main btn-big" type="button">추가하기</button>
      </div>
    </section>

    <!-- 2단계: 현황 -->
    <section class="card">
      <h2>현황</h2>
      <div id="summary" class="summary"></div>

      <label for="filterSelect">보기</label>
      <select id="filterSelect"></select>

      <div id="boardList"></div>
      <p id="emptyMessage" class="note">아직 추가한 회사가 없어요.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
